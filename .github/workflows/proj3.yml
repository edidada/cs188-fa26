name: CS188 Fall 2026 Project 3
on:
  push:
    branches: [edidada/proj3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original public autograder
        run: |
          set -o pipefail
          cd proj3
          python autograder.py --no-graphics | tee ../proj3-grade.txt
          python - <<'PY'
          import re
          from pathlib import Path
          score=re.findall(r'Total:\s*(\d+)\s*/\s*(\d+)',Path('../proj3-grade.txt').read_text())
          assert score and int(score[-1][0]) > 0 and int(score[-1][0])>=int(score[-1][1]),score
          questions=re.findall(r'Question q\d+:\s*(\d+)\s*/\s*(\d+)',Path('../proj3-grade.txt').read_text())
          assert questions and all(int(a)>=int(b) for a,b in questions),questions
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs188-proj3-grade
          path: proj3-grade.txt
